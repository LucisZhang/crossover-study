# Contract for local.silver_ml32m.tags (Phase 9, T9-3a; UPGRADE_PLAN.md §8c).
# tags.csv is landed because §8c T9-3b's content arm is "title+genres+tags"; this
# is the trusted-layer gate for it. Quarantine policy mirrors
# silver_ml32m_interactions (null keys / out-of-range ts are routed away, never
# dropped); the differences are the dataset's: the payload is free text, and the
# natural key is (user, item, TAG) rather than (user, item).
# Check order is the fixed priority for primary_reason — DO NOT reorder.
#
# NOTE on `parent_asin`: the lab-wide ITEM-IDENTITY column name (str(movieId) on
# this dataset) — same note as silver_ml32m_interactions.yaml.
name: silver_ml32m_tags
version: 1
table: local.silver_ml32m.tags

columns:
  - {name: user_id, dtype: string, nullable: false}
  - {name: parent_asin, dtype: string, nullable: false}   # str(movieId) — see note above
  - {name: tag, dtype: string, nullable: false}           # trimmed; empty text is not a tag
  - {name: ts, dtype: timestamp, nullable: false}

checks:
  # A tag with no user, no item, no text or no time is not an observation.
  # `tag` is a key here, not a payload: silver trims it and maps "" -> NULL, so a
  # whitespace-only tag lands in quarantine with a reason instead of polluting the
  # T9-3b item_text corpus with an empty token.
  - id: keys_non_null
    kind: not_null
    action: quarantine
    columns: [user_id, parent_asin, tag, ts]

  # Same bound as the interactions contract: MovieLens launched 1995 and the
  # published snapshot ends Oct 2023. Upper bound exclusive and EQUAL to
  # splits_ml32m.test_end.
  - id: ts_range
    kind: range
    action: quarantine
    column: ts
    min: "1995-01-01T00:00:00Z"
    max_exclusive: "2023-11-01T00:00:00Z"

  # No published column may be entirely NULL.
  - id: no_dead_columns
    kind: no_all_null
    action: fail

  # Published-table re-assertion of the empty-text rule (expected 0 — the gate
  # already routed those rows away). The PRE-gate null/empty rate is the number
  # that carries information; the builder publishes it to dq_ml32m.dq_results as
  # the `tag_missing_share` measure.
  - id: empty_tag_share
    kind: unknown_share
    action: measure
    column: tag
    value: ""

  # Referential health vs the movies catalog: measured, not dropped (mirrors the
  # interactions contract's item_fk). Tags on movies absent from movies.csv are a
  # real possibility and must be visible, not silently inner-joined away later.
  - id: item_fk
    kind: orphan_rate
    action: measure
    column: parent_asin
    ref_table: local.silver_ml32m.items
    ref_column: parent_asin
