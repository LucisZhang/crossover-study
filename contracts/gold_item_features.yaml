# Contract for local.gold.item_features (Phase 1, T7; docs/engineering-log/UPGRADE_PLAN.md §8).
# silver.items inner-joined to the distinct 5-core parent_asin catalog.
name: gold_item_features
version: 1
table: local.gold.item_features

columns:
  - {name: parent_asin, dtype: string, nullable: false}   # item identity (D1)
  - {name: title, dtype: string, nullable: true}
  - {name: brand_norm, dtype: string, nullable: false}    # case-folded; "unknown" if absent
  - {name: price_usd, dtype: double, nullable: true}       # parsed (D7); NULL passes range
  - {name: main_category, dtype: string, nullable: true}
  - {name: categories, dtype: "array<string>", nullable: true}
  - {name: average_rating, dtype: double, nullable: true}
  - {name: rating_number, dtype: long, nullable: true}

checks:
  - id: parent_asin_non_null
    kind: not_null
    action: fail
    column: parent_asin

  # Parsed price must be non-negative. NULL (unparseable) passes.
  - id: price_nonneg
    kind: range
    action: fail
    column: price_usd
    min: 0.0

  - id: no_dead_columns
    kind: no_all_null
    action: fail
