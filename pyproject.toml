[project]
name = "batch-recsys-lab"
version = "0.1.0"
description = "Batch Recsys Lab: Spark + Iceberg lakehouse for large-scale recommender evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.0.4",
    "pyarrow>=17",
    "pandas>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_recsys_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that start a local Spark session",
]
