[project]
name = "batch-recsys-lab"
version = "0.1.0"
description = "Crossover Study: Spark + Iceberg lakehouse for large-scale recommender evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.0.4",
    "pyarrow>=17",
    "pandas>=2",
    "pyyaml>=6",
    "scipy>=1.18.0",
]

[dependency-groups]
bench = [
    "duckdb>=1.5.5",
    "pyiceberg>=0.11.1",
]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8",
]
embed = [
    "torch>=2.4",
    "sentence-transformers>=3",
    "hnswlib>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_recsys_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "spark: tests that start a local Spark session",
]
