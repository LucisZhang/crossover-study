# RUN_ID SET AFTER THE TEST RUN — do not run before the TEST record exists
# Catalog-learnability regime map on the frozen TEST split, recomposed for the
# T8-2 recency-matched arm knn_t12m (Phase 8, T8-2;
# docs/engineering-log/UPGRADE_PLAN.md §8b). Pure recomposition of the per-user top-50 lists already
# recorded by the one-shot TEST eval runs below, crossed with the leak-free
# per-item TRAIN aggregate from `make item-train-stats` — no re-scoring, no
# refitting, no threshold tuning (every bucket edge is preregistered in
# docs/engineering-log/EXPERIMENT_LOG.md 2026-08-17).
kind: regime_map

# Canonical TEST run_ids. pop_t12m is the headline baseline (identical to
# configs/crossover_test.yaml); knn_t12m is the (deterministic, seedless) TEST
# evaluation of item-kNN-t12m (top_n=50, shrinkage=0.0, train_window_days=365).
# The un-cored popularity run 20260809T160227Z-5c70b7c is deliberately NOT here:
# it scores a different user/item universe.
run_ids:
  pop_t12m: "20260805T172047Z-035042b"
  knn_t12m: "20260818T054430Z-109c271"           # run_id of eval_itemknn_t12m_test.yaml

# Paired delta direction, matching the Phase 4/T8-1 exhibits (kNN-t12m minus popularity).
delta:
  minuend: knn_t12m
  subtrahend: pop_t12m

split: test
expected_n_users: 228153

# Metrics carried per cell. Both are exactly recomposable from the stored top-50
# (recall@K needs K <= 50; NDCG@10 only scores ranks <= 10).
cell_metrics: ["ndcg@10", "recall@20"]
k_list: [10, 20, 50]

# Same bootstrap protocol as the eval records being recomposed; per-cell child
# seeds are derived from this base seed (see eval/regime_map.py SEED_SCHEME).
bootstrap:
  n_resamples: 1000
  seed: 20260805

# Snapshot-keyed inputs. Both are resolved to the single snapshot subdir and
# cross-checked against each other and against both source records.
cache_dir: data/eval/cache
item_stats_dir: data/eval/item_train_stats
five_core_table: local.gold.interactions_5core

results_path: results/runs.jsonl

# Single-use input-equivalence exception (docs/engineering-log/EXPERIMENT_LOG.md 2026-08-17, "Phase 8
# T8-2 substrate — migration: rented Linux box is the machine of record from T8-2
# onward"). The pop_t12m comparator was scored ONCE on the Mac, on the frozen TEST
# split, against gold 5-core snapshot 8184397443787800955; the byte-identical
# rebuild on the machine of record carries a new Iceberg snapshot id
# (7217506217965106727). The presence of this block is the authorization — there
# is no enable flag — and eval/regime_map.py accepts it only after proving the two
# universes are the same bytes (item_train_stats parquet digest vs the local
# manifest, vs the expectation below, and vs the manifest embedded in the
# reference regime-map record), that the comparator artifact is byte-identical,
# and that no OTHER arm needs the exception. Everything it authorizes is
# disclosed verbatim in the emitted run record.
regime_map_input_equivalence:
  schema_version: 1
  exception_id: "t8-2-linux-rebuild-20260818"
  table: "local.gold.interactions_5core"
  record_snapshot_id: 8184397443787800955
  cache_snapshot_id: 7217506217965106727
  applies_to:
    arm: "pop_t12m"
    run_id: "20260805T172047Z-035042b"
  proof:
    kind: "item_train_stats_parquet_sha256"
    reference_regime_map_run_id: "20260817T095926Z-633d454"
    expected_sha256: "sha256:72a71aee1c689dbed1259da720f3c8671f5f7721fae2373f2028c2065734dbbf"
