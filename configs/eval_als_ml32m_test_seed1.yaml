# T9-3b ONE-SHOT TEST run (preregistration 1731cef + selections 53c98ae). Exactly one TEST evaluation per selected arm — never re-run.
# Arm A5 (ALS, binary) — Rule S1 selected: rank=64, reg_param=0.01, alpha=1.0,
# max_iter=15, weighting=binary. seeds.model=20260805 (seed1; sole primary paired-inference artifact,
# mirroring eval_als_test_seed1.yaml's seed-role convention). TEST twin of
# eval_als_ml32m_val_alpha1.yaml.
kind: eval
model:
  name: als
  params:
    rank: 64
    reg_param: 0.01
    alpha: 1.0
    max_iter: 15
    weighting: binary
    factors_root: data/eval/als_ml32m
protocol:
  eval_split: test
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
tables:
  five_core: local.gold_ml32m.interactions_5core
  user_stats: local.gold_ml32m.user_stats
  item_features: local.gold_ml32m.item_features
  popularity: local.gold_ml32m.popularity
cache_dir: data/eval/cache_ml32m
splits_path: configs/splits_ml32m.yaml
manifest_path: data/MANIFEST_ML32M.md
