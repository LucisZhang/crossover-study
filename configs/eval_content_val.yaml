# Pure MiniLM content retrieval on VAL (Phase 4, T12): recipe_hash 1f7878ff82bf
# (v1_title_brand_cat_features), cosine similarity vs L2-normalized mean-pooled
# TRAIN user profile. Cold users collapse to all-zero scores by construction.
kind: eval
model:
  name: content
  params:
    recipe_hash: "1f7878ff82bf"
    artifact_root: data/eval/minilm
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: null
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
