# T9-3b preregistered VAL run (docs/engineering-log/EXPERIMENT_LOG.md 2026-08-20 preregistration §2).
# VAL ONLY — TEST is untouched.
# Arm A5 (ALS, binary) — M* eligible. rank-axis sweep point rank=32 (§2 A5:
# rank in {32, 64 (anchor), 128}); all other params held at the anchor. Stage 1
# (rank axis) of the axis order rank -> reg -> alpha -> iter -> weighting; do
# NOT add reg/alpha/iter/weighting configs yet — those depend on this axis's
# VAL-selected winner (Rule S1). Mirrors eval_als_ml32m_val_anchor.yaml with
# rank changed.
kind: eval
model:
  name: als
  params:
    rank: 32
    reg_param: 0.01
    alpha: 10.0
    max_iter: 15
    weighting: binary
    factors_root: data/eval/als_ml32m
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
tables:
  five_core: local.gold_ml32m.interactions_5core
  user_stats: local.gold_ml32m.user_stats
  item_features: local.gold_ml32m.item_features
  popularity: local.gold_ml32m.popularity
cache_dir: data/eval/cache_ml32m
splits_path: configs/splits_ml32m.yaml
manifest_path: data/MANIFEST_ML32M.md
