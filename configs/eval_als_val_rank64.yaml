# ALS anchor config (Phase 3, E2): rank=64, reg=0.01, alpha=10, iter=15,
# binary confidence, seed 20260805. VAL only — grid tuning per §6.3; selection
# by VAL NDCG@10 (ties within 0.0001 -> cheaper config). TEST untouched.
kind: eval
model:
  name: als
  params:
    rank: 64
    reg_param: 0.01
    alpha: 10.0
    max_iter: 15
    weighting: binary
    factors_root: data/eval/als
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
