# Random-scoring baseline on the frozen TEST split (Phase 2, T7).
# The floor every other model must clear (invariant #1: TEST is reported once).
kind: eval
model:
  name: random
  params: {}
protocol:
  eval_split: test
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 13
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
