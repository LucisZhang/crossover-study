# Crossover chart, TEST (Phase 4, T15; plan §6.2/§9.1). TEST twin of
# crossover_val.yaml — split/output_stem/run_ids changed only.
# Rendered strictly from results/runs.jsonl by eval/crossover_chart.py:
#   make crossover-chart CONFIG=configs/crossover_test.yaml
