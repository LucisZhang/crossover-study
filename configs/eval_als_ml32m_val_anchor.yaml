# T9-3b preregistered VAL run (EXPERIMENT_LOG.md 2026-08-20 preregistration §2).
# VAL ONLY — TEST is untouched.
# Arm A5 (ALS, binary) — M* eligible. Anchor config of the coordinate-descent
# sweep (§2 A5): rank=64, reg_param=0.01, alpha=10.0, max_iter=15,
# weighting=binary, seeds.model=20260805. This is stage 1 (rank axis) of the
# axis order rank -> reg -> alpha -> iter -> weighting; only rank-axis configs
# (this file, rank32, rank128) are created now. Do NOT add reg/alpha/iter/
# weighting configs — those depend on the rank-axis VAL winner (Rule S1) and
# are generated after that selection, per §2/A5. factors_root is namespaced to
# data/eval/als_ml32m to keep ML-32M ALS artifacts out of the Amazon factor
# cache. Mirrors eval_als_val_rank64.yaml, ML-32M gold_ml32m namespace.
kind: eval
model:
  name: als
  params:
    rank: 64
    reg_param: 0.01
    alpha: 10.0
    max_iter: 15
    weighting: binary
    factors_root: data/eval/als_ml32m
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
tables:
  five_core: local.gold_ml32m.interactions_5core
  user_stats: local.gold_ml32m.user_stats
  item_features: local.gold_ml32m.item_features
  popularity: local.gold_ml32m.popularity
cache_dir: data/eval/cache_ml32m
splits_path: configs/splits_ml32m.yaml
manifest_path: data/MANIFEST_ML32M.md
