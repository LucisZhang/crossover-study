# ALS-decay half-life sweep (Phase 8, T8-2): half_life_days=90. VAL ONLY —
# the half-life is the arm's single tuned parameter and the preregistered grid
# is {90, 365, 1460} days (docs/engineering-log/EXPERIMENT_LOG.md 2026-08-17T11:44Z); no other value
# may be evaluated. Every other knob is held at the Phase 3 chosen ALS config
# (rank=128, reg=0.01, alpha=10, max_iter=25, primary seed 20260805).
# Requires train_age_days.npy in the cache:  make extract-age  first.
kind: eval
model:
  name: als
  params:
    rank: 128
    reg_param: 0.01
    alpha: 10.0
    max_iter: 25
    weighting: time_decay
    half_life_days: 90
    factors_root: data/eval/als
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
train:
  checkpoint_interval: 1
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
