# item-kNN top_n=50 on VAL (Phase 2, T7 tuning arm — VAL only, never TEST).
# top_n selection happens on VAL by NDCG@10, logged to runs.jsonl +
# EXPERIMENT_LOG.md before the single TEST run.
kind: eval
model:
  name: item_knn
  params:
    top_n: 50
    shrinkage: 0.0
    block_size: 8192
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: null
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
