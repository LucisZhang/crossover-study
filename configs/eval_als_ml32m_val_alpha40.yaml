# T9-3b preregistered VAL run (EXPERIMENT_LOG.md 2026-08-20 preregistration §2).
# VAL ONLY — TEST is untouched.
# Arm A5 (ALS, binary) — M* eligible. Stage 3 (alpha axis) of the coordinate
# sweep: stage 3 (alpha axis). Incumbents: rank=64 (argmax=anchor), reg=0.01
# (reg-axis argmax 0.1 tied with incumbent by CI overlap -> incumbent retained).
# This run moves ONLY alpha (10.0 -> 40.0); iter/weighting axes follow.
kind: eval
model:
  name: als
  params:
    rank: 64
    reg_param: 0.01
    alpha: 40.0
    max_iter: 15
    weighting: binary
    factors_root: data/eval/als_ml32m
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
tables:
  five_core: local.gold_ml32m.interactions_5core
  user_stats: local.gold_ml32m.user_stats
  item_features: local.gold_ml32m.item_features
  popularity: local.gold_ml32m.popularity
cache_dir: data/eval/cache_ml32m
splits_path: configs/splits_ml32m.yaml
manifest_path: data/MANIFEST_ML32M.md
