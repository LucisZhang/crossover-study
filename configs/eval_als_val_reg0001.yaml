# ALS reg sweep (Phase 3, E4/E5): reg_param=0.001 at rank-axis winner 128.
kind: eval
model:
  name: als
  params:
    rank: 128
    reg_param: 0.001
    alpha: 10.0
    max_iter: 15
    weighting: binary
    factors_root: data/eval/als
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
train:
  checkpoint_interval: 2
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
