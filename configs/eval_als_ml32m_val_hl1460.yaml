# T9-3b preregistered VAL run (docs/engineering-log/EXPERIMENT_LOG.md 2026-08-20 preregistration §2).
# VAL ONLY — TEST is untouched.
# Arm A6 (ALS-decay) — M* eligible. Half-life axis (§2 A6): all params held at
# the A5 VAL-selected config (rank=64, reg=0.01, alpha=1.0, iter=15, selected
# by Rule S1 over the 10-run coordinate sweep); ONLY the half-life is tuned,
# grid {90, 365, 1460} mirrored from T8-2. This run: half_life_days=1460.
# r = 2^(-age_days/half_life_days) enters ALS as c = 1 + alpha*r.
kind: eval
model:
  name: als
  params:
    rank: 64
    reg_param: 0.01
    alpha: 1.0
    max_iter: 15
    weighting: time_decay
    half_life_days: 1460
    factors_root: data/eval/als_ml32m
protocol:
  eval_split: val
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: 20260805
tables:
  five_core: local.gold_ml32m.interactions_5core
  user_stats: local.gold_ml32m.user_stats
  item_features: local.gold_ml32m.item_features
  popularity: local.gold_ml32m.popularity
cache_dir: data/eval/cache_ml32m
splits_path: configs/splits_ml32m.yaml
manifest_path: data/MANIFEST_ML32M.md
