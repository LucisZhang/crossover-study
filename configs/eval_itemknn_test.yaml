# item-kNN on the frozen TEST split — the SINGLE TEST run (Phase 2, T7).
# top_n finalized from the VAL selection (2026-08-06): grid {50,100,200} tied within CI; 50 chosen by VAL NDCG@10 — see EXPERIMENT_LOG.md
# (eval_itemknn_val_n{50,100,200} -> pick by VAL NDCG@10, logged to
# EXPERIMENT_LOG.md) BEFORE running this config. TEST is touched exactly once
# (invariant #1): do not iterate this file against TEST.
kind: eval
model:
  name: item_knn
  params:
    top_n: 50
    shrinkage: 0.0
    block_size: 8192
protocol:
  eval_split: test
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: null
tables:
  five_core: local.gold.interactions_5core
  user_stats: local.gold.user_stats
  item_features: local.gold.item_features
  popularity: local.gold.popularity
cache_dir: data/eval/cache
