# T9-3b ONE-SHOT TEST run (preregistration 1731cef + selections 53c98ae). Exactly one TEST evaluation per selected arm — never re-run.
# A9 = hybrid routing policy on TEST, n_star=100 — Rule S5 VAL-fitted policy
# (results/policy_select_ml32m_val.json, fitted n_star=100, objective
# 0.089686). This is the VAL-fitted finite n* policy, spent per Rule S5's
# finite-n* clause: exactly one hybrid TEST run. low = M* item-kNN-t12m
# (top_n=50, train_window_days=365); high = P* pop-t12m (as_of=train_end,
# window_days=365). Mirrors configs/eval_hybrid_test.yaml's structure
# (Amazon side routes low=content_pop_blend; ML-32M low=item_knn per M*).
kind: eval
model:
  name: hybrid
  params:
    n_star: 100
    low:
      name: item_knn
      params:
        top_n: 50
        shrinkage: 0.0
        block_size: 8192
        train_window_days: 365
    high:
      name: popularity
      params:
        as_of: train_end
        window_days: 365
protocol:
  eval_split: test
  knowledge_cutoff: train_end
  k_list: [10, 20, 50]
  batch_size: 1024
bootstrap:
  n_resamples: 1000
  seed: 20260805
seeds:
  model: null
tables:
  five_core: local.gold_ml32m.interactions_5core
  user_stats: local.gold_ml32m.user_stats
  item_features: local.gold_ml32m.item_features
  popularity: local.gold_ml32m.popularity
cache_dir: data/eval/cache_ml32m
splits_path: configs/splits_ml32m.yaml
manifest_path: data/MANIFEST_ML32M.md
